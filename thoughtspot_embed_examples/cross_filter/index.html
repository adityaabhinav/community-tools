<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThoughtSpot Cross-Filter Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }

    .status-bar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 24px;
      font-size: 13px;
      color: #6b7280;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #status-dot { font-size: 10px; }

    .embed-wrapper {
      flex: 1;
      background: #fff;
      margin: 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    #ts-embed { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div class="header">
  <div>
    <h1>ThoughtSpot Liveboard — Cross-Filter Demo</h1>
    <p>Click any viz to cross-filter other vizs on this liveboard</p>
  </div>
</div>

<div class="status-bar">
  <span id="status-dot">⏳</span>
  <span id="status-text">Initialising…</span>
</div>

<div class="embed-wrapper">
  <div id="ts-embed"></div>
</div>

<script type="module">
  import {
    init,
    LiveboardEmbed,
    AuthType,
    EmbedEvent,
  } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

  const TS_HOST = 'https://ps-internal.thoughtspot.cloud';
  const LB_ID   = '18222caa-96a7-46c9-bb42-3e9f02822fe2';

  const $dot  = document.getElementById('status-dot');
  const $text = document.getElementById('status-text');

  function setStatus(dot, text) {
    $dot.textContent  = dot;
    $text.textContent = text;
  }

  // Initialise — reuses active ThoughtSpot browser session (AuthType.None).
  // Log in to ps-internal.thoughtspot.cloud first in the same browser.
  await init({
    thoughtSpotHost: TS_HOST,
    authType: AuthType.None,
  });

  const embed = new LiveboardEmbed('#ts-embed', {
    liveboardId: LB_ID,
    fullHeight: true,              // expand to fill the container
    enableVizTransformations: true, // enables cross-filter interactions
    frameParams: { width: '100%' },
  });

  embed
    .on(EmbedEvent.Load,  () => setStatus('🟢', 'Liveboard loaded — click any chart to cross-filter'))
    .on(EmbedEvent.Error, (e) => {
      console.error('Embed error', e);
      setStatus('❌', `Error: ${JSON.stringify(e?.data ?? e)}`);
    })
    .render();

  setStatus('⏳', 'Loading liveboard…');
</script>

</body>
</html>
