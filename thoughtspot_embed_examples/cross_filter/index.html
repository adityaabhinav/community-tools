<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThoughtSpot Cross-Filter Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 24px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      min-height: 46px;
    }

    .toolbar label { font-size: 13px; font-weight: 600; color: #374151; white-space: nowrap; }

    .param-select {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      color: #111827;
      background: #f9fafb;
      cursor: pointer;
    }
    .param-select:focus { outline: 2px solid #2563eb; }

    .divider { width: 1px; background: #e5e7eb; height: 22px; }

    #status-text { font-size: 13px; color: #6b7280; }

    #pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
    }

    #clear-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    #clear-btn:hover { background: #dc2626; }

    #test-btn {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #test-btn:hover { background: #6d28d9; }

    .embed-wrapper {
      flex: 1;
      background: #fff;
      margin: 12px;
      margin-bottom: 0;
      border-radius: 10px 10px 0 0;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    #ts-embed { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div class="header">
  <h1>ThoughtSpot Liveboard — Cross-Filter Demo</h1>
  <p>Click any viz → applies runtime filter on the actual column behind the Group By parameter</p>
</div>

<div class="toolbar">
  <label for="param-select">Group By:</label>
  <!-- option values must match the exact "Group By" parameter values in ThoughtSpot -->
  <select class="param-select" id="param-select">
    <option value="Product" selected>Product</option>
    <option value="Store">Store</option>
    <option value="Office">Office</option>
  </select>

  <div class="divider"></div>
  <span id="status-text">⏳ Initialising…</span>
  <div id="pills"></div>
  <button id="test-btn" title="Manually fire UpdateRuntimeFilters with a known value to verify the column name is correct">🧪 Test Filter</button>
  <button id="clear-btn" onclick="clearFilters()">✕ Clear</button>
</div>

<!--
  Debug panel — persists VizPointClick data.
  EmbedEvent.Filter (Pendo analytics) no longer overwrites it.
-->
<div id="debug-panel" style="
  position:fixed; bottom:0; left:12px; right:12px; z-index:9999;
  background:#1e1e1e; color:#d4d4d4; font-family:monospace; font-size:12px;
  padding:10px 16px; border-radius:8px 8px 0 0;
  border:1px solid #444; max-height:200px; overflow-y:auto; display:none;
">
  <div style="color:#9cdcfe; margin-bottom:6px; font-size:11px; display:flex; justify-content:space-between;">
    <span id="debug-title">DEBUG — last UpdateRuntimeFilters call</span>
    <button onclick="document.getElementById('debug-panel').style.display='none'"
      style="background:none;border:none;color:#888;cursor:pointer;font-size:14px;">✕</button>
  </div>
  <pre id="debug-output" style="margin:0;white-space:pre-wrap;"></pre>
</div>

<div class="embed-wrapper">
  <div id="ts-embed"></div>
</div>

<script type="module">
  import {
    init,
    LiveboardEmbed,
    AuthType,
    EmbedEvent,
    HostEvent,
    RuntimeFilterOp,
  } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

  // ── Config ────────────────────────────────────────────────────────────────
  const TS_HOST    = 'https://ps-internal.thoughtspot.cloud';
  const LB_ID      = '18222caa-96a7-46c9-bb42-3e9f02822fe2';
  const PARAM_NAME = 'Group By';

  // Maps each "Group By" parameter value → actual worksheet column name (exact, case-sensitive)
  // If runtime filter still doesn't appear, check the exact column name in ThoughtSpot
  // Worksheet → open the column and copy the Display Name exactly as it appears.
  const PARAM_TO_COLUMN = {
    'Office':  'Office',
    'Product': 'product',
    'Store':   'store',
  };
  // ─────────────────────────────────────────────────────────────────────────

  const $status      = document.getElementById('status-text');
  const $pills       = document.getElementById('pills');
  const $clearBtn    = document.getElementById('clear-btn');
  const $paramSelect = document.getElementById('param-select');
  const $debugPanel  = document.getElementById('debug-panel');
  const $debugTitle  = document.getElementById('debug-title');
  const $debugOutput = document.getElementById('debug-output');

  let triggerCount = 0;

  function showDebug(title, obj) {
    $debugPanel.style.display = 'block';
    $debugTitle.textContent   = title;
    $debugOutput.textContent  = JSON.stringify(obj, null, 2);
  }

  let activeFilters    = [];
  let activeParamValue = $paramSelect.value;

  function renderFilters() {
    $pills.innerHTML = '';
    activeFilters.forEach(f => {
      const pill = document.createElement('span');
      pill.className   = 'pill';
      pill.textContent = `${f.columnName} = "${f.values[0]}"`;
      $pills.appendChild(pill);
    });
    $clearBtn.style.display = activeFilters.length ? 'inline-block' : 'none';
  }

  function applyRuntimeFilter(columnName, value, source) {
    const fp = [{ columnName, operator: RuntimeFilterOp.EQ, values: [value] }];
    triggerCount++;
    showDebug(`#${triggerCount} ${source} → UpdateRuntimeFilters`, {
      columnName,
      value,
      operator: 'EQ',
      activeParamValue,
      note: 'If no chip appears in liveboard filter bar, the column name above is likely wrong. Check exact column name in ThoughtSpot worksheet.',
    });
    console.log(`[${source}] UpdateRuntimeFilters #${triggerCount}:`, JSON.stringify(fp));
    embed.trigger(HostEvent.UpdateRuntimeFilters, fp);
    activeFilters = fp;
    $status.textContent = `✅ #${triggerCount} Filter sent → ${columnName} = "${value}"`;
    renderFilters();
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  await init({
    thoughtSpotHost: TS_HOST,
    authType: AuthType.None,
  });

  // ── Embed ─────────────────────────────────────────────────────────────────
  const embed = new LiveboardEmbed('#ts-embed', {
    liveboardId: LB_ID,
    fullHeight: true,
    enableVizTransformations: true,
    frameParams: { width: '100%' },
    runtimeParameters: [{ name: PARAM_NAME, value: activeParamValue }],
  });

  window.__embed = embed;

  // ── Parameter dropdown ───────────────────────────────────────────────────
  $paramSelect.addEventListener('change', (e) => {
    activeParamValue = e.target.value;
    embed.trigger(HostEvent.UpdateParameters, [{ name: PARAM_NAME, value: activeParamValue }]);
    activeFilters = [];
    renderFilters();
    $status.textContent = `🔄 Group By set to "${activeParamValue}" — click a viz or 🧪 Test Filter`;
  });

  // ── 🧪 Test Filter button ─────────────────────────────────────────────────
  // Fires UpdateRuntimeFilters with a fixed value so you can verify the column
  // name is correct WITHOUT having to click a viz. If a filter chip appears in
  // the liveboard filter bar after clicking this, the column name is correct.
  document.getElementById('test-btn').addEventListener('click', () => {
    const col = PARAM_TO_COLUMN[activeParamValue];
    if (!col) {
      $status.textContent = `⚠️ No column mapping for "${activeParamValue}"`;
      return;
    }
    // Use known values from the liveboard as test values
    const TEST_VALUES = { product: 'Yosemite jacket', store: 'Yosemite', Office: 'Retail' };
    const testVal = TEST_VALUES[col] ?? 'test-value';
    applyRuntimeFilter(col, testVal, 'TestBtn');
    $status.textContent += ` — if no chip appears, column name "${col}" is wrong`;
  });

  // ── VizPointClick → resolve actual column → apply runtime filter ──────────
  embed.on(EmbedEvent.VizPointClick, (payload) => {
    try {
      console.log('[VizPointClick] raw payload:', payload);

      const point =
        payload?.data?.clickedPoint ??
        payload?.clickedPoint ??
        null;

      if (!point) {
        console.warn('[VizPointClick] no clickedPoint in payload');
        showDebug('VizPointClick — no clickedPoint', { payload });
        return;
      }

      const selectedAttributes = point.selectedAttributes ?? [];

      if (selectedAttributes.length === 0) {
        $status.textContent = '⚠️ No dimension in clicked point — try a bar or table row';
        showDebug('VizPointClick — no selectedAttributes', { point });
        return;
      }

      const attrName     = selectedAttributes[0].name;
      const clickedValue = String(selectedAttributes[0].value);

      let actualColumn;
      if (attrName === 'Group by field') {
        actualColumn = PARAM_TO_COLUMN[activeParamValue];
        if (!actualColumn) {
          $status.textContent = `⚠️ No mapping for Group By = "${activeParamValue}"`;
          showDebug('VizPointClick — no column mapping', { attrName, activeParamValue, PARAM_TO_COLUMN });
          return;
        }
      } else {
        actualColumn = attrName;
      }

      applyRuntimeFilter(actualColumn, clickedValue, 'VizPointClick');

    } catch (err) {
      console.error('[VizPointClick] error:', err);
      $status.textContent = `❌ ${err.message}`;
    }
  });

  // ── EmbedEvent.Filter ─────────────────────────────────────────────────────
  // ThoughtSpot may fire this with cross-filter data; Pendo analytics also
  // fires it with { action: "pendo::connect" } — we ignore those silently
  // WITHOUT overwriting the VizPointClick debug.
  let applyingFilter = false;

  embed.on(EmbedEvent.Filter, (payload) => {
    if (applyingFilter) return;

    const filters = payload?.data?.filters ?? payload?.filters ?? [];
    const groupByFilter = filters.find(f => {
      const name = f.columnName ?? f.column_name ?? f.name ?? '';
      return name === 'Group by field';
    });

    // Ignore Pendo events (no real filters in payload)
    if (!groupByFilter) return;

    const actualColumn = PARAM_TO_COLUMN[activeParamValue];
    const value = String(groupByFilter.values?.[0] ?? groupByFilter.value ?? '');

    if (!actualColumn || !value) return;

    applyingFilter = true;
    applyRuntimeFilter(actualColumn, value, 'EmbedEvent.Filter');
    setTimeout(() => { applyingFilter = false; }, 1000);
  });

  embed
    .on(EmbedEvent.Load, () => {
      $status.textContent = `🟢 Loaded — Group By is "${activeParamValue}". Click any chart or use 🧪 Test Filter.`;
    })
    .on(EmbedEvent.Error, (e) => {
      console.error('Embed error', e);
      $status.textContent = '❌ Embed error — check console';
    })
    .render();

  // ── Clear ─────────────────────────────────────────────────────────────────
  window.clearFilters = () => {
    activeFilters = [];
    window.__embed.trigger(HostEvent.UpdateRuntimeFilters, []);
    renderFilters();
    $status.textContent = `🟢 Filters cleared. Group By is "${activeParamValue}".`;
  };
</script>

</body>
</html>
