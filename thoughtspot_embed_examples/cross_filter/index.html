<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThoughtSpot Cross-Filter Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 24px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      min-height: 46px;
    }

    .toolbar label { font-size: 13px; font-weight: 600; color: #374151; white-space: nowrap; }

    .param-select {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      color: #111827;
      background: #f9fafb;
      cursor: pointer;
    }
    .param-select:focus { outline: 2px solid #2563eb; }

    .divider { width: 1px; background: #e5e7eb; height: 22px; }

    #status-text { font-size: 13px; color: #6b7280; }

    #pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
    }

    #clear-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    #clear-btn:hover { background: #dc2626; }

    .embed-wrapper {
      flex: 1;
      background: #fff;
      margin: 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    #ts-embed { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div class="header">
  <h1>ThoughtSpot Liveboard — Cross-Filter Demo</h1>
  <p>Click any viz → applies global filter on the actual column behind the Group By parameter</p>
</div>

<div class="toolbar">
  <label for="param-select">Group By:</label>
  <!-- option values must match the exact "Group By" parameter values in ThoughtSpot -->
  <select class="param-select" id="param-select">
    <option value="Office" selected>Office</option>
    <option value="Product">Product</option>
    <option value="Store">Store</option>
  </select>

  <div class="divider"></div>
  <span id="status-text">⏳ Initialising…</span>
  <div id="pills"></div>
  <button id="clear-btn" onclick="clearFilters()">✕ Clear Filters</button>
</div>

<div class="embed-wrapper">
  <div id="ts-embed"></div>
</div>

<script type="module">
  import {
    init,
    LiveboardEmbed,
    AuthType,
    EmbedEvent,
    HostEvent,
    RuntimeFilterOp,
  } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

  // ── Config — update these to match your ThoughtSpot setup ────────────────
  const TS_HOST   = 'https://ps-internal.thoughtspot.cloud';
  const LB_ID     = '18222caa-96a7-46c9-bb42-3e9f02822fe2';

  // Parameter name exactly as defined in the ThoughtSpot data model
  const PARAM_NAME = 'Group By';

  // Maps each value of the "Group By" parameter → the actual worksheet column
  // to apply the runtime filter on.
  const PARAM_TO_COLUMN = {
    'Office':  'Office',
    'Product': 'Product',
    'Store':   'Store',
  };
  // ─────────────────────────────────────────────────────────────────────────

  // ── UI helpers ────────────────────────────────────────────────────────────
  const $status      = document.getElementById('status-text');
  const $pills       = document.getElementById('pills');
  const $clearBtn    = document.getElementById('clear-btn');
  const $paramSelect = document.getElementById('param-select');

  let activeFilters   = [];
  let activeParamValue = $paramSelect.value;   // tracks current Group By selection

  function renderFilters() {
    $pills.innerHTML = '';
    activeFilters.forEach(f => {
      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = `${f.columnName} = "${f.values[0]}"`;
      $pills.appendChild(pill);
    });
    $clearBtn.style.display = activeFilters.length ? 'inline-block' : 'none';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  await init({
    thoughtSpotHost: TS_HOST,
    authType: AuthType.None,
    // Pre-requisite: be logged into ps-internal.thoughtspot.cloud in this browser
  });

  // ── Embed ─────────────────────────────────────────────────────────────────
  const embed = new LiveboardEmbed('#ts-embed', {
    liveboardId: LB_ID,
    fullHeight: true,
    enableVizTransformations: true,
    frameParams: { width: '100%' },
  });

  window.__embed = embed;

  // ── Parameter dropdown — syncs Group By into the liveboard ───────────────
  $paramSelect.addEventListener('change', (e) => {
    activeParamValue = e.target.value;
    console.log(`[Param] Group By changed to: "${activeParamValue}"`);

    // Push the new parameter value into the liveboard
    embed.trigger(HostEvent.UpdateParameters, [
      { name: PARAM_NAME, value: activeParamValue },
    ]);

    // Clear any existing global filter since the column has changed
    activeFilters = [];
    renderFilters();
    $status.textContent = `🔄 Group By set to "${activeParamValue}" — click a viz to filter`;
  });

  // ── VizPointClick → resolve actual column → apply global filter ──────────
  embed.on(EmbedEvent.VizPointClick, (payload) => {
    try {
      console.log('[VizPointClick] raw payload:', payload);

      const point =
        payload?.data?.clickedPoint ??
        payload?.clickedPoint ??
        null;

      if (!point) {
        console.warn('[VizPointClick] no clickedPoint in payload');
        return;
      }

      const selectedAttributes = point.selectedAttributes ?? [];

      if (selectedAttributes.length === 0) {
        $status.textContent = '⚠️ No dimension in clicked point — try a bar or table row';
        return;
      }

      // The clicked value (what the user selected on the viz)
      const clickedValue = String(selectedAttributes[0].value);

      // Resolve the REAL column to filter on based on the current parameter value.
      // e.g. Group By = "Product"  →  filter column "Product"
      //      Group By = "Store"    →  filter column "Store"
      const actualColumn = PARAM_TO_COLUMN[activeParamValue];

      if (!actualColumn) {
        console.warn(`[VizPointClick] No column mapping for param value "${activeParamValue}"`);
        $status.textContent = `⚠️ No column mapping defined for "${activeParamValue}"`;
        return;
      }

      const filterPayload = [
        { columnName: actualColumn, operator: RuntimeFilterOp.EQ, values: [clickedValue] },
      ];

      console.log(
        `[VizPointClick] Group By = "${activeParamValue}"  →  ` +
        `columnName: "${actualColumn}", value: "${clickedValue}"`
      );
      console.log('[VizPointClick] Sending UpdateRuntimeFilters:', JSON.stringify(filterPayload));

      activeFilters = filterPayload;

      // UpdateRuntimeFilters is the confirmed SDK event for pushing filters
      // into the liveboard filter bar from the host app
      embed.trigger(HostEvent.UpdateRuntimeFilters, filterPayload);

      $status.textContent = `✅ Filter applied → ${actualColumn} = "${clickedValue}"`;
      renderFilters();

    } catch (err) {
      console.error('[VizPointClick] error:', err);
      $status.textContent = `❌ ${err.message}`;
    }
  });

  embed
    .on(EmbedEvent.Load,  () => {
      $status.textContent = `🟢 Loaded — Group By is "${activeParamValue}". Click any chart to filter.`;
    })
    .on(EmbedEvent.Error, (e) => {
      console.error('Embed error', e);
      $status.textContent = '❌ Embed error — check console';
    })
    .render();

  // ── Clear ─────────────────────────────────────────────────────────────────
  window.clearFilters = () => {
    activeFilters = [];
    window.__embed.trigger(HostEvent.UpdateRuntimeFilters, []);
    renderFilters();
    $status.textContent = `🟢 Filters cleared. Group By is "${activeParamValue}".`;
  };
</script>

</body>
</html>
