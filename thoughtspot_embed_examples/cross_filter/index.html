<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThoughtSpot Cross-Filter Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 24px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      min-height: 46px;
    }
    .toolbar label { font-size: 13px; font-weight: 600; color: #374151; white-space: nowrap; }

    .param-select {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      color: #111827;
      background: #f9fafb;
      cursor: pointer;
    }
    .param-select:focus { outline: 2px solid #2563eb; }

    .divider { width: 1px; background: #e5e7eb; height: 22px; }

    #status-text { font-size: 13px; color: #6b7280; }

    #pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
    }

    #clear-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    #clear-btn:hover { background: #dc2626; }

    /* Debug bar — always visible at the bottom so we can see what fires */
    #debug-bar {
      background: #1e1e1e;
      color: #d4d4d4;
      font-family: monospace;
      font-size: 12px;
      padding: 6px 16px;
      border-top: 1px solid #444;
      flex-shrink: 0;
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #debug-bar span { color: #9cdcfe; font-size: 11px; white-space: nowrap; }
    #debug-msg { flex: 1; color: #d4d4d4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .embed-wrapper {
      flex: 1;
      background: #fff;
      margin: 12px;
      margin-bottom: 0;
      border-radius: 10px 10px 0 0;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    #ts-embed { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div class="header">
  <h1>ThoughtSpot Liveboard — Cross-Filter Demo</h1>
  <p>Click any viz → resolves column from Group By parameter → applies runtime filter</p>
</div>

<div class="toolbar">
  <label for="param-select">Group By:</label>
  <select class="param-select" id="param-select">
    <option value="Product" selected>Product</option>
    <option value="Store">Store</option>
    <option value="Office">Office</option>
  </select>

  <div class="divider"></div>
  <span id="status-text">⏳ Initialising…</span>
  <div id="pills"></div>
  <button id="clear-btn" onclick="clearFilters()">✕ Clear</button>
</div>

<div class="embed-wrapper">
  <div id="ts-embed"></div>
</div>

<!-- Always-visible debug bar at the bottom -->
<div id="debug-bar">
  <span>DEBUG:</span>
  <div id="debug-msg">waiting for events…</div>
</div>

<script type="module">
  import {
    init,
    LiveboardEmbed,
    AuthType,
    EmbedEvent,
    HostEvent,
    RuntimeFilterOp,
    Action,
  } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

  // ── Config ────────────────────────────────────────────────────────────────
  const TS_HOST    = 'https://ps-internal.thoughtspot.cloud';
  const LB_ID      = '18222caa-96a7-46c9-bb42-3e9f02822fe2';
  const PARAM_NAME = 'Group By';

  // Maps Group By parameter value → actual worksheet column name (exact, case-sensitive)
  const PARAM_TO_COLUMN = {
    'Product': 'product',
    'Store':   'store',
    'Office':  'Office',
  };
  // ─────────────────────────────────────────────────────────────────────────

  const $status      = document.getElementById('status-text');
  const $pills       = document.getElementById('pills');
  const $clearBtn    = document.getElementById('clear-btn');
  const $paramSelect = document.getElementById('param-select');
  const $debugMsg    = document.getElementById('debug-msg');

  let activeFilters    = [];
  let activeParamValue = $paramSelect.value;

  function dbg(msg) {
    $debugMsg.textContent = msg;
    console.log('[DBG]', msg);
  }

  function renderFilters() {
    $pills.innerHTML = '';
    activeFilters.forEach(f => {
      const pill = document.createElement('span');
      pill.className   = 'pill';
      pill.textContent = `${f.columnName} = "${f.values[0]}"`;
      $pills.appendChild(pill);
    });
    $clearBtn.style.display = activeFilters.length ? 'inline-block' : 'none';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  await init({
    thoughtSpotHost: TS_HOST,
    authType: AuthType.None,
  });

  dbg('SDK init done — creating embed…');

  // ── Embed ─────────────────────────────────────────────────────────────────
  // hiddenActions: [Action.CrossFilter] prevents ThoughtSpot from applying its
  // native cross-filter on bar click. The click instead fires VizPointClick to
  // the host app, letting us apply UpdateRuntimeFilters on the actual column.
  const embed = new LiveboardEmbed('#ts-embed', {
    liveboardId: LB_ID,
    fullHeight: true,
    enableVizTransformations: true,
    frameParams: { width: '100%' },
    runtimeParameters: [{ name: PARAM_NAME, value: activeParamValue }],
    hiddenActions: [Action.CrossFilter, Action.RemoveCrossFilter],
  });

  window.__embed = embed;

  // ── Parameter dropdown ───────────────────────────────────────────────────
  $paramSelect.addEventListener('change', (e) => {
    activeParamValue = e.target.value;
    embed.trigger(HostEvent.UpdateParameters, [{ name: PARAM_NAME, value: activeParamValue }]);
    activeFilters = [];
    renderFilters();
    $status.textContent = `🔄 Group By = "${activeParamValue}" — click a viz`;
    dbg(`UpdateParameters → Group By = "${activeParamValue}"`);
  });

  // ── VizPointClick → resolve column → apply runtime filter ────────────────
  embed.on(EmbedEvent.VizPointClick, (payload) => {
    dbg('VizPointClick fired — processing…');
    try {
      const point =
        payload?.data?.clickedPoint ??
        payload?.clickedPoint ??
        null;

      if (!point) {
        dbg('VizPointClick: no clickedPoint in payload');
        $status.textContent = '⚠️ No clickedPoint — check console for raw payload';
        console.warn('[VizPointClick] raw payload:', JSON.stringify(payload, null, 2));
        return;
      }

      const attrs = point.selectedAttributes ?? [];
      dbg(`VizPointClick: ${attrs.length} attr(s) — ${attrs.map(a => `${a.name}=${a.value}`).join(', ') || 'none'}`);

      if (attrs.length === 0) {
        $status.textContent = '⚠️ Click landed on a measure — try clicking the category label area';
        return;
      }

      const attrName     = attrs[0].name;
      const clickedValue = String(attrs[0].value);

      // "Group by field" is the derived column driven by the parameter.
      // Map it to the real underlying column.
      const actualColumn =
        attrName === 'Group by field'
          ? PARAM_TO_COLUMN[activeParamValue]
          : attrName;

      if (!actualColumn) {
        $status.textContent = `⚠️ No column mapping for Group By = "${activeParamValue}"`;
        dbg(`No mapping: PARAM_TO_COLUMN["${activeParamValue}"] is undefined`);
        return;
      }

      const fp = [{ columnName: actualColumn, operator: RuntimeFilterOp.EQ, values: [clickedValue] }];
      dbg(`Triggering UpdateRuntimeFilters → ${actualColumn} = "${clickedValue}"`);
      embed.trigger(HostEvent.UpdateRuntimeFilters, fp);

      activeFilters = fp;
      $status.textContent = `✅ Filter applied → ${actualColumn} = "${clickedValue}"`;
      renderFilters();

    } catch (err) {
      console.error('[VizPointClick]', err);
      $status.textContent = `❌ ${err.message}`;
      dbg(`ERROR: ${err.message}`);
    }
  });

  embed
    .on(EmbedEvent.Load, () => {
      $status.textContent = `🟢 Loaded — Group By is "${activeParamValue}". Click any bar to filter.`;
      dbg('EmbedEvent.Load received — liveboard ready');
    })
    .on(EmbedEvent.Error, (e) => {
      console.error('Embed error', e);
      $status.textContent = '❌ Embed error — check console';
      dbg(`EmbedEvent.Error: ${JSON.stringify(e)}`);
    })
    .render();

  // ── Clear ─────────────────────────────────────────────────────────────────
  window.clearFilters = () => {
    activeFilters = [];
    window.__embed.trigger(HostEvent.UpdateRuntimeFilters, []);
    renderFilters();
    $status.textContent = `🟢 Filters cleared. Group By is "${activeParamValue}".`;
    dbg('UpdateRuntimeFilters → [] (cleared)');
  };
</script>

</body>
</html>
