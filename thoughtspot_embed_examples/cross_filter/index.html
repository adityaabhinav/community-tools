<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThoughtSpot Cross-Filter Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 24px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex-shrink: 0;
      min-height: 44px;
    }
    #status-text { font-size: 13px; color: #6b7280; }

    .pill {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
    }

    #clear-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    #clear-btn:hover { background: #dc2626; }

    .embed-wrapper {
      flex: 1;
      background: #fff;
      margin: 12px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    #ts-embed { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div class="header">
  <h1>ThoughtSpot Liveboard — Cross-Filter Demo</h1>
  <p>Click any viz data point → selection becomes a liveboard filter</p>
</div>

<div class="toolbar">
  <span id="status-text">⏳ Initialising…</span>
  <div id="pills"></div>
  <button id="clear-btn" onclick="clearFilters()">✕ Clear Filters</button>
</div>

<div class="embed-wrapper">
  <div id="ts-embed"></div>
</div>

<script type="module">
  import {
    init,
    LiveboardEmbed,
    AuthType,
    EmbedEvent,
    HostEvent,
  } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

  const TS_HOST = 'https://ps-internal.thoughtspot.cloud';
  const LB_ID   = '18222caa-96a7-46c9-bb42-3e9f02822fe2';

  // ── UI helpers ────────────────────────────────────────────────────────────
  const $status   = document.getElementById('status-text');
  const $pills    = document.getElementById('pills');
  const $clearBtn = document.getElementById('clear-btn');

  let activeFilters = [];

  function renderFilters() {
    $pills.innerHTML = '';
    activeFilters.forEach(f => {
      const pill = document.createElement('span');
      pill.className = 'pill';
      pill.textContent = `${f.columnName} = "${f.values[0]}"`;
      $pills.appendChild(pill);
    });
    $clearBtn.style.display = activeFilters.length ? 'inline-block' : 'none';
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  // Pre-requisite: be logged into ps-internal.thoughtspot.cloud in this browser.
  await init({
    thoughtSpotHost: TS_HOST,
    authType: AuthType.None,
  });

  // ── Embed ─────────────────────────────────────────────────────────────────
  const embed = new LiveboardEmbed('#ts-embed', {
    liveboardId: LB_ID,
    fullHeight: true,
    enableVizTransformations: true,
    frameParams: { width: '100%' },
  });

  // Expose for the clear button (plain onclick, outside module scope)
  window.__embed = embed;

  // ── Resolve actual column name via ThoughtSpot metadata API ─────────────
  // A derived/formula column has a display name that differs from the real
  // source column. We fetch the column metadata using its GUID (attr.id) and
  // pull `name` from the response, which is the actual underlying column name.
  async function resolveActualColumnName(columnId) {
    try {
      const res = await fetch(
        `${TS_HOST}/api/rest/2.0/metadata/search`,
        {
          method: 'POST',
          credentials: 'include',           // reuse the active browser session
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            metadata: [{ type: 'LOGICAL_COLUMN', identifier: columnId }],
          }),
        }
      );

      if (!res.ok) {
        console.warn(`[resolveActualColumnName] API returned ${res.status} for column ${columnId}`);
        return null;
      }

      const json = await res.json();
      console.log(`[resolveActualColumnName] metadata for ${columnId}:`, json);

      // The actual column name is in the first result's header
      const actual = json?.[0]?.metadata_header?.name ?? null;
      console.log(`[resolveActualColumnName] actual column name: "${actual}"`);
      return actual;

    } catch (err) {
      console.error('[resolveActualColumnName] fetch failed:', err);
      return null;
    }
  }

  // ── VizPointClick → global filter on the same liveboard ──────────────────
  embed.on(EmbedEvent.VizPointClick, async (payload) => {
    try {
      console.log('[VizPointClick] raw payload:', payload);

      const point =
        payload?.data?.clickedPoint ??
        payload?.clickedPoint ??
        null;

      if (!point) {
        console.warn('[VizPointClick] clickedPoint not found in payload');
        return;
      }

      console.log('[VizPointClick] clickedPoint:', point);

      const selectedAttributes = point.selectedAttributes ?? [];

      if (selectedAttributes.length === 0) {
        console.warn('[VizPointClick] selectedAttributes is empty');
        $status.textContent = '⚠️ Clicked point has no dimension attribute — try a bar or table row';
        return;
      }

      $status.textContent = '⏳ Resolving column names…';

      // For each selected attribute, resolve the ACTUAL column name from its
      // GUID (attr.id) — this unwraps derived/formula column display names.
      activeFilters = await Promise.all(
        selectedAttributes.map(async (attr) => {
          console.log('[VizPointClick] raw attr:', attr);

          const displayName = attr.name;           // may be a derived/alias name
          const columnId    = attr.id;             // GUID of the column
          const value       = String(attr.value);  // clicked value

          // Try to get the actual column name via metadata API
          const actualName = columnId
            ? await resolveActualColumnName(columnId)
            : null;

          // Fall back to displayName if the API didn't return anything
          const columnName = actualName ?? displayName;

          console.log(
            `[VizPointClick] displayName: "${displayName}" | columnId: "${columnId}" | actualName: "${actualName}" | using: "${columnName}" | value: "${value}"`
          );

          return { columnName, operator: 'EQ', values: [value] };
        })
      );

      console.log('[VizPointClick] applying to global filter:', activeFilters);

      embed.trigger(HostEvent.UpdateFilters, { filters: activeFilters });

      $status.textContent = `✅ Global filter set — ${activeFilters.map(f => `${f.columnName} = "${f.values[0]}"`).join(' | ')}`;
      renderFilters();

    } catch (err) {
      console.error('[VizPointClick] error:', err);
      $status.textContent = `❌ ${err.message}`;
    }
  });

  embed
    .on(EmbedEvent.Load,  () => {
      $status.textContent = '🟢 Liveboard loaded — click any chart to filter';
    })
    .on(EmbedEvent.Error, (e) => {
      console.error('Embed error', e);
      $status.textContent = `❌ Embed error — check console`;
    })
    .render();

  // ── Clear ─────────────────────────────────────────────────────────────────
  window.clearFilters = () => {
    activeFilters = [];
    window.__embed.trigger(HostEvent.UpdateFilters, { filters: [] });
    renderFilters();
    $status.textContent = '🟢 Filters cleared';
  };
</script>

</body>
</html>
