<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ThoughtSpot Cross-Filter Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: #fff;
      padding: 14px 24px;
      flex-shrink: 0;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header p  { font-size: 12px; opacity: .75; margin-top: 2px; }

    .toolbar {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
      min-height: 46px;
    }
    .toolbar label { font-size: 13px; font-weight: 600; color: #374151; white-space: nowrap; }

    .param-select {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
      color: #111827;
      background: #f9fafb;
      cursor: pointer;
    }
    .param-select:focus { outline: 2px solid #2563eb; }

    .divider { width: 1px; background: #e5e7eb; height: 22px; }

    #status-text { font-size: 13px; color: #6b7280; }

    #pills { display: flex; gap: 6px; flex-wrap: wrap; }
    .pill {
      background: #dcfce7;
      border: 1px solid #86efac;
      color: #15803d;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
    }

    #clear-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: none;
    }
    #clear-btn:hover { background: #dc2626; }

    /* Always-visible debug bar — shows exactly what event arrived last */
    #debug-bar {
      background: #1e1e1e;
      color: #9cdcfe;
      font-family: monospace;
      font-size: 11px;
      padding: 5px 14px;
      border-top: 1px solid #333;
      flex-shrink: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .embed-wrapper {
      flex: 1;
      background: #fff;
      margin: 12px;
      margin-bottom: 0;
      border-radius: 10px 10px 0 0;
      border: 1px solid #e5e7eb;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    #ts-embed { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div class="header">
  <h1>ThoughtSpot Liveboard — Cross-Filter Demo</h1>
  <p>Native cross-filter preserved · runtime filter also applied on the underlying column</p>
</div>

<div class="toolbar">
  <label for="param-select">Group By:</label>
  <select class="param-select" id="param-select">
    <option value="Product" selected>Product</option>
    <option value="Store">Store</option>
    <option value="Office">Office</option>
  </select>

  <div class="divider"></div>
  <span id="status-text">⏳ Initialising…</span>
  <div id="pills"></div>
  <button id="clear-btn" onclick="clearFilters()">✕ Clear</button>
</div>

<div class="embed-wrapper">
  <div id="ts-embed"></div>
</div>

<!-- Always-visible debug bar — shows what postMessage arrived last -->
<div id="debug-bar">waiting for events…</div>

<script type="module">
  import {
    init,
    LiveboardEmbed,
    AuthType,
    EmbedEvent,
    HostEvent,
    RuntimeFilterOp,
  } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

  // ── Config ────────────────────────────────────────────────────────────────
  const TS_HOST    = 'https://ps-internal.thoughtspot.cloud';
  const LB_ID      = '18222caa-96a7-46c9-bb42-3e9f02822fe2';
  const PARAM_NAME = 'Group By';

  const PARAM_TO_COLUMN = {
    'Product': 'product',
    'Store':   'store',
    'Office':  'Office',
  };
  // ─────────────────────────────────────────────────────────────────────────

  const $status      = document.getElementById('status-text');
  const $pills       = document.getElementById('pills');
  const $clearBtn    = document.getElementById('clear-btn');
  const $paramSelect = document.getElementById('param-select');
  const $debugBar    = document.getElementById('debug-bar');

  let activeFilters    = [];
  let activeParamValue = $paramSelect.value;

  function dbg(msg) {
    $debugBar.textContent = msg;
    console.log('[DBG]', msg);
  }

  function renderFilters() {
    $pills.innerHTML = '';
    activeFilters.forEach(f => {
      const pill = document.createElement('span');
      pill.className   = 'pill';
      pill.textContent = `${f.columnName} = "${f.values[0]}"`;
      $pills.appendChild(pill);
    });
    $clearBtn.style.display = activeFilters.length ? 'inline-block' : 'none';
  }

  function applyRuntimeFilter(col, val, source) {
    const fp = [{ columnName: col, operator: RuntimeFilterOp.EQ, values: [val] }];
    dbg(`[${source}] UpdateRuntimeFilters → ${col} = "${val}"`);
    embed.trigger(HostEvent.UpdateRuntimeFilters, fp);
    activeFilters = fp;
    $status.textContent = `✅ Filter → ${col} = "${val}"  (via ${source})`;
    renderFilters();
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  await init({
    thoughtSpotHost: TS_HOST,
    authType: AuthType.None,
  });

  // ── Embed — native cross-filter left ON ───────────────────────────────────
  const embed = new LiveboardEmbed('#ts-embed', {
    liveboardId: LB_ID,
    fullHeight: true,
    enableVizTransformations: true,
    frameParams: { width: '100%' },
    runtimeParameters: [{ name: PARAM_NAME, value: activeParamValue }],
    // No hiddenActions — native cross-filter remains active
  });

  window.__embed = embed;

  // ── Parameter dropdown ───────────────────────────────────────────────────
  $paramSelect.addEventListener('change', (e) => {
    activeParamValue = e.target.value;
    embed.trigger(HostEvent.UpdateParameters, [{ name: PARAM_NAME, value: activeParamValue }]);
    activeFilters = [];
    renderFilters();
    $status.textContent = `🔄 Group By = "${activeParamValue}" — click a viz`;
    dbg(`UpdateParameters → Group By = "${activeParamValue}"`);
  });

  // ── Raw postMessage listener ───────────────────────────────────────────────
  // VizPointClick does NOT fire when ThoughtSpot applies a native cross-filter —
  // ThoughtSpot handles the click internally. But the iframe still sends a
  // postMessage to the parent. We intercept ALL messages, log their action names
  // (visible in the debug bar + console), and handle the cross-filter message
  // once we can confirm its exact format from the logs.
  window.addEventListener('message', (event) => {
    if (!event.data || typeof event.data !== 'object') return;

    const msg    = event.data;
    const action = String(msg?.action ?? msg?.type ?? msg?.data?.action ?? '');

    // Skip known analytics noise
    if (!action || action.startsWith('pendo') || action === 'webpack') return;

    // Log everything else so we can see what the cross-filter event looks like
    dbg(`postMsg: "${action}"`);
    console.log('[TS postMsg]', action, JSON.stringify(msg, null, 2));

    // ── Attempt to handle cross-filter (action name confirmed from logs) ───
    // ThoughtSpot may use names like "crossFilter", "CROSS_FILTER", "applyFilter",
    // "vizCrossFilter", etc. We match broadly and refine after seeing the logs.
    const actionLc = action.toLowerCase().replace(/[_-]/g, '');

    if (actionLc.includes('crossfilter') || actionLc === 'vizmouseclick') {
      console.log('[CrossFilter candidate] full message:', JSON.stringify(msg, null, 2));

      // Try several payload shapes — narrow down after logs confirm format
      const inner   = msg?.data ?? msg;
      const filters =
        inner?.filters ??
        inner?.crossFilters ??
        inner?.filterContent ??
        inner?.clickedPoint?.selectedAttributes ?? [];

      const gbFilter = Array.isArray(filters) && filters.find(f => {
        const name = String(f.columnName ?? f.column ?? f.name ?? f.displayName ?? '');
        return name === 'Group by field';
      });

      if (gbFilter) {
        const col = PARAM_TO_COLUMN[activeParamValue];
        const val = String(
          gbFilter.values?.[0] ?? gbFilter.value ?? gbFilter.selectedValues?.[0] ?? ''
        );
        if (col && val) applyRuntimeFilter(col, val, 'postMsg:crossFilter');
      }
    }

    // ── VizPointClick via raw message (fires independently of cross-filter) ─
    if (actionLc === 'vizpointclick' || actionLc === 'charttablemouseclick') {
      const inner  = msg?.data ?? msg;
      const point  = inner?.clickedPoint ?? inner;
      const attrs  = point?.selectedAttributes ?? [];

      if (attrs.length > 0) {
        const attrName = attrs[0].name;
        const val      = String(attrs[0].value ?? '');
        const col =
          attrName === 'Group by field'
            ? PARAM_TO_COLUMN[activeParamValue]
            : attrName;

        if (col && val) applyRuntimeFilter(col, val, 'postMsg:vizPointClick');
      }
    }
  });

  // ── SDK VizPointClick (fires when cross-filter is NOT the handler) ────────
  embed.on(EmbedEvent.VizPointClick, (payload) => {
    dbg('SDK VizPointClick fired');
    try {
      const point = payload?.data?.clickedPoint ?? payload?.clickedPoint ?? null;
      if (!point) return;

      const attrs = point.selectedAttributes ?? [];
      if (attrs.length === 0) {
        $status.textContent = '⚠️ Click hit a measure — try the category label';
        return;
      }

      const attrName = attrs[0].name;
      const val      = String(attrs[0].value ?? '');
      const col =
        attrName === 'Group by field'
          ? PARAM_TO_COLUMN[activeParamValue]
          : attrName;

      if (!col) {
        dbg(`No mapping for "${activeParamValue}"`);
        return;
      }

      applyRuntimeFilter(col, val, 'VizPointClick');
    } catch (err) {
      dbg(`VizPointClick error: ${err.message}`);
    }
  });

  embed
    .on(EmbedEvent.Load, () => {
      $status.textContent = `🟢 Loaded — Group By is "${activeParamValue}". Click any bar.`;
      dbg('EmbedEvent.Load — liveboard ready');
    })
    .on(EmbedEvent.Error, (e) => {
      $status.textContent = '❌ Embed error — check console';
      dbg(`EmbedEvent.Error: ${JSON.stringify(e)}`);
    })
    .render();

  // ── Clear ─────────────────────────────────────────────────────────────────
  window.clearFilters = () => {
    activeFilters = [];
    window.__embed.trigger(HostEvent.UpdateRuntimeFilters, []);
    renderFilters();
    $status.textContent = `🟢 Filters cleared. Group By is "${activeParamValue}".`;
    dbg('UpdateRuntimeFilters → [] (cleared)');
  };
</script>

</body>
</html>
