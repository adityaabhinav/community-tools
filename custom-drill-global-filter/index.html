<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Drill – Global Filter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f6f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── toolbar (Group By selector + active filters) ── */
        #toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            background: #fff;
            border-bottom: 1px solid #dde3f0;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        #group-by-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #333;
        }
        #group-by-bar label { font-weight: 600; white-space: nowrap; }
        #group-by-select {
            border: 1px solid #c0cce0;
            border-radius: 4px;
            padding: 4px 10px;
            font-size: 13px;
            background: #fff;
            cursor: pointer;
            color: #1a3a6b;
        }
        #group-by-select:focus { outline: 2px solid #4a7fd4; }

        #filter-bar {
            display: none;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        #filter-bar.visible { display: flex; }
        #filter-bar .label { font-weight: 600; font-size: 13px; color: #1a3a6b; white-space: nowrap; }
        #filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            background: #e8f0fe;
            border: 1px solid #4a7fd4;
            border-radius: 14px;
            padding: 3px 10px;
            font-size: 12px;
            color: #1a3a6b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip button {
            background: none; border: none; cursor: pointer;
            color: #888; font-size: 15px; line-height: 1; padding: 0;
        }
        .chip button:hover { color: #c00; }
        #clear-all {
            background: none; border: 1px solid #c0392b; border-radius: 4px;
            color: #c0392b; cursor: pointer; font-size: 12px;
            padding: 4px 10px; white-space: nowrap;
        }
        #clear-all:hover { background: #fdf0ee; }

        /* ── embed ── */
        #embed-container { flex: 1; width: 100%; min-height: 0; }
        #embed-container iframe { width: 100%; height: 100%; border: none; }

        /* ── debug panel ── */
        #debug-panel {
            position: fixed; bottom: 0; right: 0; width: 460px;
            max-height: 300px; overflow-y: auto;
            background: #1e1e1e; color: #d4d4d4;
            font-family: monospace; font-size: 11px;
            border-top-left-radius: 6px;
            z-index: 9999; display: none;
        }
        #debug-panel.visible { display: block; }
        #debug-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #333; padding: 6px 10px; position: sticky; top: 0;
            font-size: 11px; font-weight: bold; color: #ccc;
        }
        #debug-header button { background: none; border: none; color: #aaa; cursor: pointer; }
        #debug-log { padding: 6px 10px; }
        .dbline { margin-bottom: 4px; border-bottom: 1px solid #2a2a2a; padding-bottom: 4px; word-break: break-all; }
        .t  { color: #569cd6; margin-right: 4px; }
        .ok { color: #4ec9b0; }
        .w  { color: #dcdcaa; }
        .v  { color: #ce9178; }
        #debug-toggle {
            position: fixed; bottom: 8px; right: 8px;
            background: #333; color: #ccc; border: none; border-radius: 4px;
            padding: 4px 10px; cursor: pointer; font-size: 11px; z-index: 10000;
        }
    </style>
</head>
<body>

<div id="toolbar">
    <div id="group-by-bar">
        <label for="group-by-select">Group By:</label>
        <select id="group-by-select" onchange="onGroupByChange(this.value)">
            <!-- options are populated from GROUP_BY_OPTIONS below -->
        </select>
    </div>

    <div id="filter-bar">
        <span class="label">Filters:</span>
        <div id="filter-chips"></div>
        <button id="clear-all" onclick="clearAllFilters()">Clear all</button>
    </div>
</div>

<div id="embed-container"></div>

<div id="debug-panel">
    <div id="debug-header">
        <span>Debug log — full payloads in browser console</span>
        <button onclick="document.getElementById('debug-panel').classList.remove('visible')">✕</button>
    </div>
    <div id="debug-log"></div>
</div>
<button id="debug-toggle" onclick="document.getElementById('debug-panel').classList.toggle('visible')">Debug</button>

<script type="module">
    import {
        init,
        LiveboardEmbed,
        AuthType,
        EmbedEvent,
        HostEvent,
        RuntimeFilterOp,
    } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

    // ════════════════════════════════════════════════════════════════════════
    //  CONFIGURATION — edit these values
    // ════════════════════════════════════════════════════════════════════════

    const CLUSTER_URL  = 'https://ps-internal.thoughtspot.cloud';
    const LIVEBOARD_ID = '18222caa-96a7-46c9-bb42-3e9f02822fe2';

    // Action ID as configured in ThoughtSpot Admin > Custom Actions
    const CUSTOM_DRILL_ACTION_ID = 'curated-drill-down';

    // ── Group By configuration ────────────────────────────────────────────
    // GROUP_BY_COLUMN_NAME : exact name of the formula column in the viz
    // GROUP_BY_PARAM_NAME  : ThoughtSpot parameter name that drives it
    // GROUP_BY_OPTIONS     : all possible parameter values, first one = default
    //                        each entry: { label: 'display text', value: 'param value' }
    //                        'value' must match exactly what ThoughtSpot expects
    //
    // When the user clicks a data point in GROUP_BY_COLUMN_NAME:
    //   filter COLUMN = currently selected GROUP_BY_OPTIONS value
    //   filter VALUE  = the clicked cell value in that column
    const GROUP_BY_COLUMN_NAME = 'Group by field';
    const GROUP_BY_PARAM_NAME  = 'Group By';
    const GROUP_BY_OPTIONS = [
        // ← REPLACE these with your actual parameter values
        { label: 'Region',     value: 'Region'     },
        { label: 'Store',      value: 'Store'       },
        { label: 'Department', value: 'Department'  },
    ];

    // Only needed if a parameter value string differs from the column name to
    // filter on, e.g. param value = 'Store' but column name = 'Store Name'.
    const GROUP_BY_PARAM_MAP = {
        // 'Store': 'Store Name',
    };

    // ════════════════════════════════════════════════════════════════════════

    let activeFilters       = [];
    // Always reflects the dropdown selection — never null after init.
    let currentGroupByParam = null;

    // ── Build the Group By dropdown ─────────────────────────────────────────
    const sel = document.getElementById('group-by-select');
    GROUP_BY_OPTIONS.forEach(opt => {
        const el = document.createElement('option');
        el.value       = opt.value;
        el.textContent = opt.label;
        sel.appendChild(el);
    });
    // Seed currentGroupByParam from the first option immediately.
    if (GROUP_BY_OPTIONS.length) {
        currentGroupByParam = GROUP_BY_OPTIONS[0].value;
        dbg(`<span class="ok">Group By initialised → "${escapeHtml(currentGroupByParam)}"</span>`);
    }

    // Called whenever the dropdown changes.
    window.onGroupByChange = function (value) {
        currentGroupByParam = value;
        dbg(`<span class="ok">Group By changed → "${escapeHtml(value)}"</span>`);
        // Sync the new parameter value into the ThoughtSpot embed.
        embed.trigger(HostEvent.UpdateRuntimeParameters, [
            { name: GROUP_BY_PARAM_NAME, value },
        ]);
    };

    // ── SDK init ────────────────────────────────────────────────────────────
    init({
        thoughtSpotHost: CLUSTER_URL,
        authType: AuthType.None,
    });

    const embed = new LiveboardEmbed('#embed-container', {
        liveboardId: LIVEBOARD_ID,
        fullHeight: true,
        // Start the liveboard with the default Group By parameter.
        runtimeParameters: GROUP_BY_OPTIONS.length
            ? [{ name: GROUP_BY_PARAM_NAME, value: GROUP_BY_OPTIONS[0].value }]
            : [],
    });

    embed.on(EmbedEvent.CustomAction, (payload) => {
        const raw = payload?.data ?? payload;
        const id  = raw?.id ?? raw?.actionId ?? '(unknown)';

        dbg(`CustomAction fired — id: <span class="v">${escapeHtml(id)}</span>`);
        console.log('[custom-drill] Full payload:', raw);

        if (id !== CUSTOM_DRILL_ACTION_ID) {
            dbg(`<span class="w">⚠ id "${escapeHtml(id)}" ≠ CUSTOM_DRILL_ACTION_ID</span>`);
            return;
        }
        handleCustomDrill(raw);
    });

    embed.on(EmbedEvent.Error, e =>
        dbg(`<span class="w">SDK error: ${escapeHtml(JSON.stringify(e))}</span>`)
    );

    embed.render();
    dbg('<span class="ok">Embed rendered.</span>');

    // ── Custom drill handler ─────────────────────────────────────────────────
    async function handleCustomDrill(data) {
        // ── Step 1: fetch the current "Group By" parameter value ──────────────
        // Called here (not on LiveboardRendered) because the liveboard is
        // guaranteed to be fully interactive when a custom action fires.
        if (GROUP_BY_PARAM_NAME) {
            try {
                const resp = await embed.trigger(HostEvent.GetParameters);
                console.log('[custom-drill] GetParameters response:', resp);
                dbg(`GetParameters: <span class="v">${escapeHtml(JSON.stringify(resp))}</span>`);

                const paramVal = pickParam(resp, GROUP_BY_PARAM_NAME);
                if (paramVal != null) {
                    currentGroupByParam = paramVal;
                    // Keep the dropdown in sync.
                    const sel = document.getElementById('group-by-select');
                    if (sel && sel.value !== paramVal) sel.value = paramVal;
                    dbg(`<span class="ok">Group By from GetParameters → "${escapeHtml(paramVal)}"</span>`);
                } else {
                    dbg(`<span class="w">GetParameters returned no value for "${escapeHtml(GROUP_BY_PARAM_NAME)}" — falling back to dropdown (${escapeHtml(String(currentGroupByParam))})</span>`);
                }
            } catch (e) {
                dbg(`<span class="w">GetParameters threw: ${escapeHtml(String(e))} — falling back to dropdown (${escapeHtml(String(currentGroupByParam))})</span>`);
            }
        }

        // ── Step 2: extract column/value candidates from the clicked point ────
        const candidates = extractCandidates(data);
        dbg(`Candidates: <span class="v">${escapeHtml(JSON.stringify(candidates))}</span>`);

        if (!candidates.length) {
            dbg('<span class="w">⚠ No column/value pairs in payload.</span>');
            return;
        }

        const filters = candidates
            .map(c => resolveFilter(c))
            .filter(Boolean)
            .map(({ columnName, value }) => ({
                columnName,
                operator: RuntimeFilterOp.EQ,
                values:   [String(value)],
            }));

        if (!filters.length) {
            dbg('<span class="w">⚠ No filters resolved.</span>');
            return;
        }

        dbg(`Applying: <span class="v">${escapeHtml(JSON.stringify(filters))}</span>`);
        applyFilters(filters);
    }

    // Walk the GetParameters response — handles arrays, { parameters: [] },
    // and flat { "Group By": "value" } shapes.
    function pickParam(resp, paramName) {
        if (!resp) return null;
        const nameLower = paramName.toLowerCase();

        const list = resp.parameters ?? resp.runtimeParameters ??
                     (Array.isArray(resp) ? resp : null);
        if (Array.isArray(list)) {
            const hit = list.find(p =>
                String(p.name ?? p.parameterName ?? p.key ?? '').toLowerCase() === nameLower
            );
            const val = hit?.value ?? hit?.parameterValue ?? hit?.currentValue;
            if (val != null) return String(val);
        }

        // Flat key: { "Group By": "Region" }
        const direct = resp[paramName];
        if (direct != null) return String(direct);

        return null;
    }

    // ── Payload extraction ───────────────────────────────────────────────────
    function extractCandidates(data) {
        const out = [];

        // Shape A: context-menu action (right-click on a data point)
        const points = data?.contextMenuPoints?.selectedPoints ?? [];
        if (points.length) {
            const pt = points[0];
            for (const attr of (pt.selectedAttributes ?? [])) {
                const name = attr?.column?.name ?? attr?.columnName;
                if (name != null && attr?.value != null)
                    out.push({ columnName: name, value: attr.value });
            }
            const measures = pt.selectedMeasures;
            if (measures && !Array.isArray(measures)) {
                for (const [name, value] of Object.entries(measures))
                    out.push({ columnName: name, value });
            } else if (Array.isArray(measures)) {
                for (const m of measures) {
                    const name = m?.column?.name ?? m?.columnName;
                    if (name != null && m?.value != null) out.push({ columnName: name, value: m.value });
                }
            }
            if (out.length) return out;
        }

        // Shape B: embedAnswerData (primary / more-options action)
        const ans = data?.embedAnswerData;
        if (ans?.columns?.length && ans?.data?.length) {
            const row = ans.data[0];
            ans.columns.forEach((col, i) => {
                const name = col?.column?.name ?? col?.name;
                if (name != null && row[i] != null) out.push({ columnName: name, value: row[i] });
            });
        }

        return out;
    }

    // ── Group By resolution ──────────────────────────────────────────────────
    // If the clicked column is the Group By formula column:
    //   filter COLUMN = currentGroupByParam (the dropdown selection)
    //   filter VALUE  = the clicked cell value
    function resolveFilter({ columnName, value }) {
        if (!GROUP_BY_COLUMN_NAME || columnName !== GROUP_BY_COLUMN_NAME) {
            return { columnName, value };
        }

        if (!currentGroupByParam) {
            dbg('<span class="w">⚠ currentGroupByParam is null — add at least one entry to GROUP_BY_OPTIONS.</span>');
            return { columnName, value };
        }

        const col = GROUP_BY_PARAM_MAP[currentGroupByParam] ?? currentGroupByParam;
        dbg(`<span class="ok">Group By resolved → col="${escapeHtml(col)}", val="${escapeHtml(String(value))}"</span>`);
        return { columnName: col, value };
    }

    // ── Filter management ────────────────────────────────────────────────────
    function applyFilters(newFilters) {
        newFilters.forEach(f => {
            const i = activeFilters.findIndex(a => a.columnName === f.columnName);
            if (i >= 0) activeFilters[i] = f; else activeFilters.push(f);
        });
        embed.trigger(HostEvent.UpdateRuntimeFilters, activeFilters);
        renderFilterBar();
    }

    function removeFilter(columnName) {
        activeFilters = activeFilters.filter(f => f.columnName !== columnName);
        embed.trigger(HostEvent.UpdateRuntimeFilters, activeFilters);
        renderFilterBar();
    }

    window.clearAllFilters = function () {
        activeFilters = [];
        embed.trigger(HostEvent.UpdateRuntimeFilters, []);
        renderFilterBar();
    };

    function renderFilterBar() {
        const bar   = document.getElementById('filter-bar');
        const chips = document.getElementById('filter-chips');
        chips.innerHTML = '';
        if (!activeFilters.length) { bar.classList.remove('visible'); return; }
        bar.classList.add('visible');
        activeFilters.forEach(f => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML =
                `<span>${escapeHtml(f.columnName)} = <strong>${escapeHtml(f.values[0])}</strong></span>` +
                `<button onclick="window._removeFilter('${escapeAttr(f.columnName)}')">×</button>`;
            chips.appendChild(chip);
        });
    }

    window._removeFilter = removeFilter;

    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

    function dbg(html) {
        console.log('[custom-drill]', html.replace(/<[^>]+>/g, ''));
        const log  = document.getElementById('debug-log');
        const line = document.createElement('div');
        line.className = 'dbline';
        line.innerHTML = `<span class="t">[${new Date().toLocaleTimeString()}]</span>${html}`;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }
</script>
</body>
</html>
