<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Drill – Global Filter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f6f8;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── filter bar ── */
        #filter-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: #e8f0fe;
            border-bottom: 1px solid #c5d5f5;
            font-size: 13px;
            flex-shrink: 0;
        }
        #filter-bar.visible { display: flex; }
        #filter-bar .label { font-weight: 600; color: #1a3a6b; white-space: nowrap; }
        #filter-chips { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
        .chip {
            background: #fff;
            border: 1px solid #4a7fd4;
            border-radius: 14px;
            padding: 3px 10px;
            font-size: 12px;
            color: #1a3a6b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .chip button {
            background: none; border: none; cursor: pointer;
            color: #888; font-size: 15px; line-height: 1; padding: 0;
        }
        .chip button:hover { color: #c00; }
        #clear-all {
            background: none; border: 1px solid #c0392b; border-radius: 4px;
            color: #c0392b; cursor: pointer; font-size: 12px;
            padding: 4px 10px; white-space: nowrap;
        }
        #clear-all:hover { background: #fdf0ee; }

        /* ── embed ── */
        #embed-container { flex: 1; width: 100%; min-height: 0; }
        #embed-container iframe { width: 100%; height: 100%; border: none; }

        /* ── debug panel ── */
        #debug-panel {
            position: fixed; bottom: 0; right: 0; width: 460px;
            max-height: 300px; overflow-y: auto;
            background: #1e1e1e; color: #d4d4d4;
            font-family: monospace; font-size: 11px;
            border-top-left-radius: 6px;
            z-index: 9999;
            display: none;
        }
        #debug-panel.visible { display: block; }
        #debug-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #333; padding: 6px 10px; position: sticky; top: 0;
            font-size: 11px; font-weight: bold; color: #ccc;
        }
        #debug-header button { background: none; border: none; color: #aaa; cursor: pointer; font-size: 12px; }
        #debug-log { padding: 6px 10px; }
        .dbline { margin-bottom: 4px; border-bottom: 1px solid #2a2a2a; padding-bottom: 4px; word-break: break-all; }
        .t  { color: #569cd6; margin-right: 4px; }
        .ok { color: #4ec9b0; }
        .w  { color: #dcdcaa; }
        .v  { color: #ce9178; }
        #debug-toggle {
            position: fixed; bottom: 8px; right: 8px;
            background: #333; color: #ccc; border: none; border-radius: 4px;
            padding: 4px 10px; cursor: pointer; font-size: 11px; z-index: 10000;
        }
    </style>
</head>
<body>

<div id="filter-bar">
    <span class="label">Active Filters:</span>
    <div id="filter-chips"></div>
    <button id="clear-all" onclick="clearAllFilters()">Clear all</button>
</div>

<div id="embed-container"></div>

<div id="debug-panel">
    <div id="debug-header">
        <span>Debug log — open browser console for full payloads</span>
        <button onclick="document.getElementById('debug-panel').classList.remove('visible')">✕</button>
    </div>
    <div id="debug-log"></div>
</div>
<button id="debug-toggle" onclick="document.getElementById('debug-panel').classList.toggle('visible')">Debug</button>

<script type="module">
    import {
        init,
        LiveboardEmbed,
        AuthType,
        EmbedEvent,
        HostEvent,
        RuntimeFilterOp,
    } from 'https://cdn.jsdelivr.net/npm/@thoughtspot/visual-embed-sdk/dist/tsembed.es.js';

    // ════════════════════════════════════════════════════════════════════════
    //  CONFIGURATION
    // ════════════════════════════════════════════════════════════════════════

    const CLUSTER_URL  = 'https://ps-internal.thoughtspot.cloud';
    const LIVEBOARD_ID = '18222caa-96a7-46c9-bb42-3e9f02822fe2';

    // Action ID as configured in ThoughtSpot Admin > Custom Actions
    const CUSTOM_DRILL_ACTION_ID = 'curated-drill-down';

    // ── Group By configuration ────────────────────────────────────────────
    //
    // When a formula column switches dimensions based on a parameter, e.g.:
    //   if [GroupByParam] = 'Region' then [Region] else [Store Name] end
    //
    // The filter rule is:
    //   filter COLUMN  = current value of the Group By parameter  (e.g. 'Region')
    //   filter VALUE   = value of the formula column at the clicked point (e.g. 'North')
    //
    // Set GROUP_BY_COLUMN_NAME to the exact name of the formula column in the viz.
    // Set GROUP_BY_PARAM_NAME  to the ThoughtSpot parameter name that drives it.
    //
    // If the parameter value IS the same string as the column name you want to
    // filter on (most common), no further mapping is needed.
    // If they differ, populate GROUP_BY_PARAM_MAP, e.g.:
    //   { 'Store': 'Store Name', 'Dept': 'Department Name' }
    //
    // Set GROUP_BY_COLUMN_NAME to null to skip Group By logic entirely.

    // "Group by field" is the formula column in the viz.
    // "Group By" is the ThoughtSpot parameter that controls which dimension it shows.
    // When a drill fires on this column:
    //   filter column = current value of the "Group By" parameter
    //   filter value  = the clicked value in "Group by field"
    const GROUP_BY_COLUMN_NAME  = 'Group by field';
    const GROUP_BY_PARAM_NAME   = 'Group By';
    // Only populate this if a parameter value string differs from the column
    // name you want to filter on (e.g. param = 'Store' but column = 'Store Name').
    const GROUP_BY_PARAM_MAP = {};

    // ════════════════════════════════════════════════════════════════════════

    let activeFilters       = [];
    let currentGroupByParam = null; // set from GetParameters on LiveboardRendered

    // ── SDK init ────────────────────────────────────────────────────────────
    init({
        thoughtSpotHost: CLUSTER_URL,
        authType: AuthType.None,
    });

    const embed = new LiveboardEmbed('#embed-container', {
        liveboardId: LIVEBOARD_ID,
        fullHeight: true,
    });

    // Parameter is read directly from the custom action payload at click time.
    // No separate network call needed.

    // ── Listen for the custom action ────────────────────────────────────────
    embed.on(EmbedEvent.CustomAction, (payload) => {
        // Normalise: some SDK versions pass data directly, others wrap in { data }
        const raw = payload?.data ?? payload;
        const id  = raw?.id ?? raw?.actionId ?? '(unknown)';

        dbg(`CustomAction fired — id: <span class="v">${escapeHtml(id)}</span>`);
        console.log('[custom-drill] Full payload:', raw);

        if (id !== CUSTOM_DRILL_ACTION_ID) {
            dbg(`<span class="w">⚠ id "${escapeHtml(id)}" ≠ CUSTOM_DRILL_ACTION_ID "${escapeHtml(CUSTOM_DRILL_ACTION_ID)}"</span>`);
            return;
        }
        handleCustomDrill(raw);
    });

    embed.on(EmbedEvent.Error, e =>
        dbg(`<span class="w">SDK error: ${escapeHtml(JSON.stringify(e))}</span>`)
    );

    embed.render();
    dbg('<span class="ok">Embed rendered — click the custom action on a data point.</span>');

    // ── Custom drill handler ─────────────────────────────────────────────────
    function handleCustomDrill(data) {
        // Read the current Group By parameter value from the payload itself —
        // no extra network call, guaranteed to reflect the state at click time.
        if (GROUP_BY_PARAM_NAME) {
            const paramVal = extractParamValue(data, GROUP_BY_PARAM_NAME);
            if (paramVal != null) {
                currentGroupByParam = paramVal;
                dbg(`<span class="ok">Group By param from payload = "${escapeHtml(paramVal)}"</span>`);
            } else {
                dbg(`<span class="w">⚠ "${escapeHtml(GROUP_BY_PARAM_NAME)}" not found in payload. Full payload logged to console.</span>`);
                console.log('[custom-drill] Full payload (param not found):', data);
            }
        }

        const candidates = extractCandidates(data);
        dbg(`Candidates: <span class="v">${escapeHtml(JSON.stringify(candidates))}</span>`);

        if (!candidates.length) {
            dbg('<span class="w">⚠ No column/value pairs found in payload.</span>');
            return;
        }

        const filters = [];
        for (const candidate of candidates) {
            const resolved = resolveFilter(candidate, candidates);
            if (resolved) {
                filters.push({
                    columnName: resolved.columnName,
                    operator:   RuntimeFilterOp.EQ,
                    values:     [String(resolved.value)],
                });
            }
        }

        if (!filters.length) {
            dbg('<span class="w">⚠ No filters resolved.</span>');
            return;
        }

        dbg(`Applying: <span class="v">${escapeHtml(JSON.stringify(filters))}</span>`);
        applyFilters(filters);
    }

    // ── Parameter extraction from custom action payload ──────────────────────
    // ThoughtSpot may nest the runtime parameters in several different places
    // depending on the SDK version and action type. Try them all.
    function extractParamValue(data, paramName) {
        const nameLower = paramName.toLowerCase();

        // Collect every array that could be a parameter list
        const candidates = [
            data?.runtimeParameters,
            data?.embedAnswerData?.runtimeParameters,
            data?.embedAnswerData?.parameterValues,
            data?.reportBookData?.runtimeParameters,
            data?.contextMenuPoints?.runtimeParameters,
        ].filter(Array.isArray);

        for (const list of candidates) {
            const hit = list.find(p =>
                String(p.name ?? p.parameterName ?? p.key ?? '').toLowerCase() === nameLower
            );
            const val = hit?.value ?? hit?.parameterValue ?? hit?.currentValue;
            if (val != null) return String(val);
        }

        // Flat key on embedAnswerData: { "Group By": "Region" }
        const flat = data?.embedAnswerData?.[paramName] ?? data?.[paramName];
        if (flat != null) return String(flat);

        return null;
    }

    // ── Payload extraction ───────────────────────────────────────────────────
    function extractCandidates(data) {
        const out = [];

        // Shape A: context-menu (right-click on a data point) — preferred for drill
        const points = data?.contextMenuPoints?.selectedPoints ?? [];
        if (points.length) {
            const pt = points[0];

            for (const attr of (pt.selectedAttributes ?? [])) {
                const name = attr?.column?.name ?? attr?.columnName;
                if (name != null && attr?.value != null) {
                    out.push({ columnName: name, value: attr.value });
                }
            }

            const measures = pt.selectedMeasures;
            if (measures && !Array.isArray(measures)) {
                for (const [name, value] of Object.entries(measures)) {
                    out.push({ columnName: name, value });
                }
            } else if (Array.isArray(measures)) {
                for (const m of measures) {
                    const name = m?.column?.name ?? m?.columnName;
                    if (name != null && m?.value != null) out.push({ columnName: name, value: m.value });
                }
            }

            if (out.length) return out;
        }

        // Shape B: full embedAnswerData (primary / more-options action)
        const ans = data?.embedAnswerData;
        if (ans?.columns?.length && ans?.data?.length) {
            const row = ans.data[0];
            ans.columns.forEach((col, i) => {
                const name = col?.column?.name ?? col?.name;
                if (name != null && row[i] != null) out.push({ columnName: name, value: row[i] });
            });
        }

        return out;
    }

    // ── Group By resolution ──────────────────────────────────────────────────
    // For a "Group By" formula column the rule is:
    //   filter COLUMN = the Group By parameter's current value  (= the chosen dimension)
    //   filter VALUE  = the clicked formula value               (= the dimension member)
    function resolveFilter({ columnName, value }, allCandidates) {
        if (!GROUP_BY_COLUMN_NAME || columnName !== GROUP_BY_COLUMN_NAME) {
            // Regular column — use as-is
            return { columnName, value };
        }

        // ── Group By column ──────────────────────────────────────────────────

        // Method 1: we know the current parameter value
        if (currentGroupByParam) {
            // The parameter value might directly be the column name, or there
            // might be a mapping entry for it.
            const col = GROUP_BY_PARAM_MAP[currentGroupByParam] ?? currentGroupByParam;
            dbg(`<span class="ok">Group By resolved via param "${escapeHtml(currentGroupByParam)}" → col="${escapeHtml(col)}", val="${escapeHtml(String(value))}"</span>`);
            return { columnName: col, value };
        }

        // Method 2: smart value-match — find another attribute in the same data
        // point that has the identical value (works when the underlying dimension
        // column is also present in the search).
        const match = allCandidates.find(c =>
            c.columnName !== GROUP_BY_COLUMN_NAME &&
            String(c.value) === String(value)
        );
        if (match) {
            dbg(`<span class="ok">Group By value-matched → col="${escapeHtml(match.columnName)}", val="${escapeHtml(String(value))}"</span>`);
            return { columnName: match.columnName, value };
        }

        // Fallback — can't resolve; filter on the formula column itself
        dbg(`<span class="w">⚠ Group By column could not be resolved. Set GROUP_BY_PARAM_NAME so the param is tracked automatically, or call setGroupByParam("Region") from the console.</span>`);
        return { columnName, value };
    }

    // ── Filter management ────────────────────────────────────────────────────
    function applyFilters(newFilters) {
        newFilters.forEach(f => {
            const i = activeFilters.findIndex(a => a.columnName === f.columnName);
            if (i >= 0) activeFilters[i] = f; else activeFilters.push(f);
        });
        embed.trigger(HostEvent.UpdateRuntimeFilters, activeFilters);
        renderFilterBar();
    }

    function removeFilter(columnName) {
        activeFilters = activeFilters.filter(f => f.columnName !== columnName);
        embed.trigger(HostEvent.UpdateRuntimeFilters, activeFilters);
        renderFilterBar();
    }

    window.clearAllFilters = function () {
        activeFilters = [];
        embed.trigger(HostEvent.UpdateRuntimeFilters, []);
        renderFilterBar();
    };

    // Manual override — call from browser console if auto-detection fails:
    //   setGroupByParam('YourDimensionName')
    window.setGroupByParam = function (val) {
        currentGroupByParam = val;
        dbg(`<span class="ok">currentGroupByParam manually → "${escapeHtml(val)}"</span>`);
    };

    function renderFilterBar() {
        const bar   = document.getElementById('filter-bar');
        const chips = document.getElementById('filter-chips');
        chips.innerHTML = '';
        if (!activeFilters.length) { bar.classList.remove('visible'); return; }
        bar.classList.add('visible');
        activeFilters.forEach(f => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerHTML =
                `<span>${escapeHtml(f.columnName)} = <strong>${escapeHtml(f.values[0])}</strong></span>` +
                `<button title="Remove" onclick="window._removeFilter('${escapeAttr(f.columnName)}')">×</button>`;
            chips.appendChild(chip);
        });
    }

    window._removeFilter = removeFilter;

    // ── Helpers ──────────────────────────────────────────────────────────────
    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function escapeAttr(s) { return String(s).replace(/'/g, "\\'"); }

    function dbg(html) {
        console.log('[custom-drill]', html.replace(/<[^>]+>/g, ''));
        const log  = document.getElementById('debug-log');
        const line = document.createElement('div');
        line.className = 'dbline';
        line.innerHTML = `<span class="t">[${new Date().toLocaleTimeString()}]</span>${html}`;
        log.appendChild(line);
        log.scrollTop = log.scrollHeight;
    }
</script>
</body>
</html>
